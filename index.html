<!DOCTYPE html>
<html>
<head>
  <title>HUMAX</title>
</head>
<body style="text-align:center; background:black; color:white;">
  <h1>HUMAX Mini App</h1>

  <button onclick="connect()">Connect Wallet</button>
  <br><br>

  <button onclick="verify()">Verify Human</button>
  <br><br>

  <button onclick="claim()">Claim 10 HUMAX</button>

  <script>
    async function connect() {
      alert("Wallet connected (demo)")
    }

    async function verify() {
      alert("Verified (demo)")
    }

    async function claim() {
      let claimed = localStorage.getItem("claimed")

      if (claimed) {
        alert("Already claimed ❌")
      } else {
        localStorage.setItem("claimed", true)
        alert("You got 10 HUMAX ✅")
      }
    }
  </script>
</body>
</html>
